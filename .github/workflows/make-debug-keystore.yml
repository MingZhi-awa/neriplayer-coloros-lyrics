name: Make debug keystore

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate stable debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug-keystore.jks \
            -storetype JKS \
            -storepass neriplayer-coloros-lyrics \
            -keypass neriplayer-coloros-lyrics \
            -alias neriplayerlyrics \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=NeriPlayer ColorOS Lyrics Debug, O=maoyu, C=CN"

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug-keystore.jks
